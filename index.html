<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#020F2E;font-family:Lato,sans-serif;color:#FFFFFF;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#FFFFFF}a:hover{color:#E3E4E8}
input::placeholder{color:rgba(255,255,255,.35)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #8FB0FF;outline-offset:2px}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 85% -10%,#0A47C2 0%,rgba(10,71,194,0) 60%),radial-gradient(700px 520px at -10% 110%,#053BA0 0%,rgba(5,59,160,0) 60%),#020F2E">
<header style="position:relative;padding:22px clamp(18px,5vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px">
<img src="assets/wordmark-white.png" alt="Skilleaze" style="height:30px;width:auto;display:block">
<span style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.75)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Secure checkout</span>
</header>
<main style="position:relative;flex:1;width:100%;max-width:560px;margin:0 auto;padding:clamp(16px,4vw,40px) clamp(16px,4vw,24px) 56px;display:flex;flex-direction:column;gap:26px">
<div style="display:flex;flex-direction:column;gap:10px">
<h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(26px,7.4vw,46px);line-height:1.05;letter-spacing:-.01em;color:#FFFFFF;white-space:nowrap">Complete your payment</h1>
<div style="width:56px;height:2px;background:#8FB0FF;border-radius:2px"></div>
</div>
<section style="background:rgba(255,255,255,.07);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:clamp(20px,4vw,30px);display:flex;flex-direction:column;gap:24px;box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)">
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:11px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.55)">COUNTRY</div>
<button onClick="{{ togglePick }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;background:rgba(255,255,255,.06);cursor:pointer;font-family:Lato,sans-serif;color:#FFFFFF;text-align:left" style-hover="background:rgba(255,255,255,.1)">
<span style="display:flex;align-items:center;gap:12px;min-width:0"><span style="font-size:24px;line-height:1">{{ flag }}</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font-size:16px;font-weight:700">{{ countryName }}</span><span style="font-size:13px;color:rgba(255,255,255,.6)">{{ curLine }}</span></span></span>
<span style="font-size:13px;font-weight:700;color:#8FB0FF;white-space:nowrap">{{ pickLabel }}</span>
</button>
<sc-if value="{{ picking }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px;background:rgba(2,15,46,.75)">
<input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search country or currency" style="border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;font:400 15px Lato,sans-serif;outline:none;background:rgba(255,255,255,.06);color:#FFFFFF">
<div style="max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ countries }}" as="c" hint-placeholder-count="6">
<button onClick="{{ c.pick }}" style="display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;font:400 14px Lato,sans-serif;color:#FFFFFF;text-align:left" style-hover="background:rgba(255,255,255,.08)"><span style="font-size:18px">{{ c.flag }}</span><span style="flex:1">{{ c.name }}</span><span style="font-weight:700;color:rgba(255,255,255,.55)">{{ c.cur }}</span></button>
</sc-for>
</div>
</div>
</sc-if>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:11px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.55)">SERVICES</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
<sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
<button onClick="{{ s.pick }}" style="{{ s.style }}"><span style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%"><span style="font-size:13px;font-weight:700;line-height:1.3">{{ s.name }}</span><span style="{{ s.tick }}">✓</span></span><span style="font-size:16px;font-weight:900">{{ s.price }}</span></button>
</sc-for>
</div>
</div>
<label style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:11px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.55)">AMOUNT</span>
<span style="display:flex;align-items:center;gap:10px;border:1px solid rgba(143,176,255,.55);border-radius:18px;padding:6px 18px;background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(143,176,255,.08)">
<span style="font-size:24px;font-weight:700;color:rgba(255,255,255,.8);white-space:nowrap">{{ sym }}</span>
<input value="{{ amount }}" onChange="{{ onAmount }}" inputMode="decimal" placeholder="0" aria-label="Amount" style="flex:1;min-width:0;border:0;outline:none;font:900 36px Lato,sans-serif;color:#FFFFFF;padding:8px 0;background:transparent">
<span style="font-size:13px;font-weight:900;color:rgba(255,255,255,.55);letter-spacing:.08em">{{ code }}</span>
</span>
</label>
<sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
<div style="background:rgba(255,92,92,.14);border:1px solid rgba(255,120,120,.4);color:#FFD5D5;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700">{{ err }}</div>
</sc-if>
<button onClick="{{ pay }}" style="display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:19px 22px;background:#FFFFFF;color:#042D7C;font:900 17px Lato,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.3)" style-hover="background:#E3E9F8">
<span>{{ payLabel }}</span><span style="font-size:20px">→</span>
</button>
<div style="display:flex;justify-content:center;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.04em">Secured by Dodo Payments</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;productId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dodo Payments&quot;},&quot;testMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Dodo Payments&quot;}}">
const C = {IN:['India','INR'],AE:['United Arab Emirates','AED'],SA:['Saudi Arabia','SAR'],QA:['Qatar','QAR'],KW:['Kuwait','KWD'],BH:['Bahrain','BHD'],OM:['Oman','OMR'],US:['United States','USD'],GB:['United Kingdom','GBP'],CA:['Canada','CAD'],AU:['Australia','AUD'],NZ:['New Zealand','NZD'],SG:['Singapore','SGD'],MY:['Malaysia','MYR'],DE:['Germany','EUR'],FR:['France','EUR'],IE:['Ireland','EUR'],NL:['Netherlands','EUR'],IT:['Italy','EUR'],ES:['Spain','EUR'],PT:['Portugal','EUR'],BE:['Belgium','EUR'],AT:['Austria','EUR'],FI:['Finland','EUR'],GR:['Greece','EUR'],LU:['Luxembourg','EUR'],CH:['Switzerland','CHF'],SE:['Sweden','SEK'],NO:['Norway','NOK'],DK:['Denmark','DKK'],PL:['Poland','PLN'],CZ:['Czech Republic','CZK'],HU:['Hungary','HUF'],RO:['Romania','RON'],JP:['Japan','JPY'],KR:['South Korea','KRW'],HK:['Hong Kong','HKD'],TH:['Thailand','THB'],ID:['Indonesia','IDR'],PH:['Philippines','PHP'],VN:['Vietnam','VND'],LK:['Sri Lanka','LKR'],BD:['Bangladesh','BDT'],NP:['Nepal','NPR'],PK:['Pakistan','PKR'],EG:['Egypt','EGP'],ZA:['South Africa','ZAR'],NG:['Nigeria','NGN'],KE:['Kenya','KES'],MA:['Morocco','MAD'],JO:['Jordan','JOD'],TR:['Turkey','TRY'],BR:['Brazil','BRL'],MX:['Mexico','MXN']};
// ▼ PASTE YOUR DODO PRODUCT ID HERE, and set LIVE to true when you go live
const DODO_PRODUCT_ID = 'pdt_0Nr8kfRb47HSl2RswsKe8';
const LIVE = false;
const ZERO = {JPY:1,KRW:1,VND:1,IDR:1,HUF:1};
const FIXED = {INR:[490,590,100,690,690,990],AED:[20,25,5,30,30,39],USD:[6,9,2,10,10,15]};
const SVC = ['ATS-Friendly CV','Europass CV','Cover Letter','LinkedIn Optimization','Job Portal Optimization','Personal Portfolio'];
const flag = cc => cc.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
class Component extends DCLogic {
  state = { cc: 'IN', amount: '', note: '', svc: [], err: '', picking: false, q: '', rates: null };
  async componentDidMount() {
    const qs = new URLSearchParams(location.search); const st = {};
    if (qs.get('amount') && !isNaN(+qs.get('amount'))) st.amount = qs.get('amount');
    if (qs.get('for')) st.note = qs.get('for');
    let cc = (qs.get('country') || '').toUpperCase();
    if (!C[cc]) { try { const j = await (await fetch('https://ipapi.co/json/')).json(); cc = (j.country_code || '').toUpperCase(); } catch (e) {} }
    if (!C[cc]) { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; cc = /Kolkata|Calcutta/.test(tz) ? 'IN' : /Dubai/.test(tz) ? 'AE' : /Riyadh/.test(tz) ? 'SA' : /Qatar/.test(tz) ? 'QA' : /Kuwait/.test(tz) ? 'KW' : /Bahrain/.test(tz) ? 'BH' : /Muscat/.test(tz) ? 'OM' : /London/.test(tz) ? 'GB' : /^Europe/.test(tz) ? 'DE' : /Sydney|Melbourne/.test(tz) ? 'AU' : /Singapore/.test(tz) ? 'SG' : 'US'; }
    st.cc = cc; this.setState(st);
    try { const j = await (await fetch('https://open.er-api.com/v6/latest/USD')).json(); if (j && j.rates) this.setState({ rates: j.rates }); } catch (e) {}
  }
  cur() { return C[this.state.cc][1]; }
  rate(c) { const R = this.state.rates; return c === 'USD' ? 1 : R && R[c] ? R[c] : null; }
  fmt(c, v) { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: c, maximumFractionDigits: ZERO[c] ? 0 : 2 }).format(v); } catch (e) { return c + ' ' + v; } }
  applySvc(sel) { const ps = sel.map(i => this.price(i)); const ok = ps.every(p => p != null); const tot = ok ? Math.round(ps.reduce((a, b) => a + b, 0) * 100) / 100 : null; this.setState({ svc: sel, err: '', amount: sel.length ? (tot != null ? String(tot) : '') : '', note: sel.length ? sel.map(i => SVC[i]).join(' + ') : '' }); }
  price(i) { const c = this.cur(); if (FIXED[c]) return FIXED[c][i]; const r = this.rate(c); if (!r) return null; const v = FIXED.USD[i] * r; return ZERO[c] ? Math.ceil(v / 10) * 10 : v >= 100 ? Math.ceil(v) : Math.ceil(v * 10) / 10; }
  nice(c, v) { const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(v)) - 1)); return Math.round(v / p) * p; }
  pay() {
    const c = this.cur(); const v = parseFloat(this.state.amount);
    if (!v || v <= 0) return this.setState({ err: 'Enter the amount you want to pay.' });
    const r = this.rate(c); if (!r) return this.setState({ err: 'Loading exchange rates, please try again in a moment.' });
    const usd = Math.max(0.5, Math.round(v / r * 100) / 100);
    const pid = (this.props.productId || DODO_PRODUCT_ID || '').trim();
    if (!pid) return this.setState({ err: 'Online payment is not set up yet. Please contact hello@skilleaze.com.' });
    const host = (this.props.testMode === false || (this.props.testMode == null && LIVE)) ? 'https://checkout.dodopayments.com' : 'https://test.checkout.dodopayments.com';
    const p = new URLSearchParams({ quantity: '1', paymentAmount: String(usd), country: this.state.cc, paymentCurrency: c, redirect_url: 'https://www.skilleaze.com/?payment=done' });
    if (this.state.note) p.set('metadata_services', this.state.note.slice(0, 200));
    p.set('metadata_amount_local', c + ' ' + v);
    (window.top || window).location.href = host + '/buy/' + encodeURIComponent(pid) + '?' + p.toString();
  }
  renderVals() {
    const { cc, amount, note, err, picking, q } = this.state; const c = this.cur(); const r = this.rate(c);
    const v = parseFloat(amount); const ql = q.trim().toLowerCase();
    const sym = (() => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: c, currencyDisplay: 'narrowSymbol' }).formatToParts(0).find(x => x.type === 'currency').value; } catch (e) { return c; } })();
    const chip = on => `border-radius:12px;padding:12px 4px;font:900 14px Lato,sans-serif;cursor:pointer;background:${on ? '#042D7C' : '#F1F2F5'};color:${on ? '#FFFFFF' : '#042D7C'};border:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis`;
    const card = on => `display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px;border-radius:16px;cursor:pointer;font-family:Lato,sans-serif;color:#FFFFFF;background:${on ? 'rgba(143,176,255,.18)' : 'rgba(255,255,255,.05)'};border:1px solid ${on ? 'rgba(143,176,255,.85)' : 'rgba(255,255,255,.12)'};min-height:78px;transition:background .15s,border-color .15s`;
    return {
      flag: flag(cc), countryName: C[cc][0], curLine: 'Paying in ' + c, pickLabel: picking ? 'Close' : 'Change',
      togglePick: () => this.setState({ picking: !picking, q: '' }), picking, q, onQ: e => this.setState({ q: e.target.value }),
      countries: Object.keys(C).filter(k => !ql || C[k][0].toLowerCase().includes(ql) || C[k][1].toLowerCase().includes(ql)).sort((a, b) => C[a][0].localeCompare(C[b][0])).map(k => ({ flag: flag(k), name: C[k][0], cur: C[k][1], pick: () => this.setState({ cc: k, picking: false, err: '' }, () => this.applySvc(this.state.svc)) })),
      services: SVC.map((s, i) => { const p = this.price(i); const on = this.state.svc.includes(i); return { name: s, price: p != null ? this.fmt(c, p) : '…', style: card(on), tick: `width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#042D7C;background:${on ? '#FFFFFF' : 'transparent'};border:${on ? '0' : '1.5px solid rgba(255,255,255,.35)'}`, pick: () => { const sel = on ? this.state.svc.filter(x => x !== i) : [...this.state.svc, i].sort(); this.applySvc(sel); } }; }),
      sym, code: sym === c ? '' : c, amount, note,
      note2: this.state.svc.length > 1 ? this.state.svc.length + ' services selected. Total is filled in above.' : 'Pick services or enter any amount. Checkout charges it in ' + c + '.',
      onAmount: e => this.setState({ amount: e.target.value.replace(/[^0-9.]/g, ''), svc: [], err: '' }),
      onNote: e => this.setState({ note: e.target.value }),
      err, pay: () => this.pay(),
      payLabel: v > 0 ? 'Pay ' + this.fmt(c, v) : 'Continue to payment'
    };
  }
}
</script>
</body>
</html>
